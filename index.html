<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Should We Go? — check the weather and get a clear go / no-go for your outdoor activity." />
    <title>Should We Go? · Outdoor Activity Planner</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/pages/home.js"></script>
  </head>

  <body>
    <div id="site-header"></div>

    <main id="main">
      <section class="hero" aria-labelledby="page-title">
        <div class="container">
          <h1 id="page-title">Should we go?</h1>
          <p class="hero__lead">
            Pick a city, an activity and a day. We'll check the forecast and tell you if it's worth it.
          </p>

          <!-- Submits to forecast.html?city=...&activity=...&day=... -->
          <form class="search-form card" id="search-form" action="forecast.html" method="get" novalidate>
            <div class="field search-form__city">
              <label class="field__label" for="city-input">City</label>
              <input class="input" id="city-input" name="city" type="text" placeholder="e.g. Toronto" autocomplete="address-level2" required />
            </div>

            <div class="field">
              <label class="field__label" for="activity-select">Activity</label>
              <select class="select" id="activity-select" name="activity" required></select>
            </div>

            <div class="field">
              <label class="field__label" for="day-select">Day</label>
              <select class="select" id="day-select" name="day"></select>
            </div>

            <button class="btn btn--primary search-form__submit" type="submit">Check weather</button>

            <p class="alert alert--error search-form__error" id="search-error" role="alert" hidden></p>
          </form>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
