<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Should We Go? · Outdoor Activity Planner</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/home.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">⛰</span>
          <span class="brand__name">Should We Go?</span>
        </a>
        <nav aria-label="Main">
          <ul class="nav" role="list">
            <li><a class="nav__link" href="index.html" aria-current="page">Plan</a></li>
            <li><a class="nav__link" href="saved.html">Saved plans</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <h1>Should we go?</h1>
          <p class="hero__lead">
            Pick a city, an activity and a day. We'll check the forecast and tell you if it's worth it.
          </p>

          <form class="search-form card" id="search-form" action="forecast.html" method="get" novalidate>
            <div class="field search-form__city">
              <label class="field__label" for="city-input">City</label>
              <input class="input" id="city-input" name="city" type="text" placeholder="e.g. Toronto" required />
            </div>

            <div class="field">
              <label class="field__label" for="activity-select">Activity</label>
              <select class="select" id="activity-select" name="activity"></select>
            </div>

            <div class="field">
              <label class="field__label" for="day-select">Day</label>
              <select class="select" id="day-select" name="day"></select>
            </div>

            <button class="btn btn--primary search-form__submit" type="submit">Check weather</button>

            <p class="alert alert--error search-form__error" id="search-error" role="alert" hidden></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Should We Go? · CPAN 113 Group 5 · Weather data by <a href="https://open-meteo.com/">Open-Meteo</a></p>
    </footer>
  </body>
</html>
