<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved plans · Should We Go?</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/theme.js"></script>
    <script src="js/saved.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">⛰</span>
          <span class="brand__name">Should We Go?</span>
        </a>
        <div class="header-actions">
          <nav aria-label="Main">
            <ul class="nav" role="list">
              <li><a class="nav__link" href="index.html">Plan</a></li>
              <li><a class="nav__link" href="saved.html" aria-current="page">Saved plans</a></li>
            </ul>
          </nav>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">🌙</button>
        </div>
      </div>
    </header>

    <main class="container saved">
      <header class="saved__header">
        <div>
          <p class="eyebrow">Compare later</p>
          <h1 class="saved__title">Saved plans</h1>
        </div>
        <div class="summary">
          <div class="summary__item">
            <span class="summary__value" id="summary-average"></span>
            <span class="summary__label">Average score</span>
          </div>
          <div class="summary__item">
            <span class="summary__value" id="summary-total"></span>
            <span class="summary__label">Plans</span>
          </div>
        </div>
      </header>

      <form class="toolbar" id="saved-toolbar">
        <div class="field">
          <label class="field__label" for="filter-activity">Activity</label>
          <select class="select" id="filter-activity" name="activity">
            <option value="all">All activities</option>
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="filter-verdict">Verdict</label>
          <select class="select" id="filter-verdict" name="verdict">
            <option value="all">Any verdict</option>
            <option value="go">Go</option>
            <option value="maybe">Maybe</option>
            <option value="nogo">Stay home</option>
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="sort-plans">Sort by</label>
          <select class="select" id="sort-plans" name="sort">
            <option value="date-asc">Date (soonest)</option>
            <option value="date-desc">Date (latest)</option>
            <option value="score-desc">Score (highest)</option>
            <option value="score-asc">Score (lowest)</option>
            <option value="saved-desc">Recently saved</option>
          </select>
        </div>
      </form>

      <div class="state" id="saved-empty" hidden>
        <p class="state__icon" aria-hidden="true">🎒</p>
        <p>No saved plans yet. Check the weather and save a plan to compare it later.</p>
        <a class="btn btn--primary" href="index.html">Plan an activity</a>
      </div>

      <ul class="plan-list" id="plan-list" role="list"></ul>
    </main>

    <footer class="site-footer">
      <p>Should We Go? · CPAN 113 Group 5 · Weather data by <a href="https://open-meteo.com/">Open-Meteo</a></p>
    </footer>
  </body>
</html>
